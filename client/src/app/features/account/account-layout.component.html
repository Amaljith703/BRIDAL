<section class="account-area section"><div class="shell">
  <header class="account-head">
    <div><p class="eyebrow">Your studio account</p><h1>Good to see you, <em>{{ auth.user()?.firstName || 'friend' }}.</em></h1><p class="muted">A quieter place to keep the details of your visits with us.</p></div>
    <span class="account-avatar" aria-hidden="true">{{ (auth.user()?.firstName || 'M').slice(0, 1) }}</span>
  </header>
  <div class="account-layout">
    <nav class="account-nav" aria-label="Your account">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!link.exact }">{{ link.label }}</a>
      }
    </nav>
    <main class="account-content"><router-outlet /></main>
  </div>
</div></section>
