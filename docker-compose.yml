services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: makeupart-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./database/backups:/var/opt/mssql/backups
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  sql-data:
    external: true
    name: makeupart-sqldata
